[package]
name = "your-voice-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "your-voice"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
hound = "3.5"
indicatif = "0.17"
ctrlc = "3"
dirs = "5"
